appId: com.pi67.desktop
# Keep the release/bundle filename stable while platform display metadata uses the π brand.
productName: Pi-67 Desktop
icon: eng/packaging/icon.png
asar: true
directories:
  output: artifacts/release
files:
  - apps/desktop/dist/**
  - apps/agent-host/dist/**
  - apps/renderer/dist/**
  - packages/pi-runtime/dist/**
  - packages/extension-compat/dist/**
  - packages/protocol/dist/**
  - packages/domain/dist/**
  - node_modules/**
  # Runtime packages do not consume source maps or TypeScript declarations.
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/*.d.mts"
  - "!node_modules/**/*.d.cts"
  # These three workspace packages are loaded from the explicit app dist paths above.
  - "!node_modules/@pi67/{agent-host,desktop,renderer}/**"
  # Keep every scalar/SIMD Node core fallback. The Agent Host never loads the
  # browser-inline WASM payloads that duplicate those external .wasm files.
  - "!node_modules/tesseract.js-core/*.wasm.js"
  # Pi-67 copies the full bilingual 4.0.0 data into its isolated OCR cache.
  - "!node_modules/@tesseract.js-data/{eng,chi_sim}/4.0.0_best_int/**"
  # OfficeParser executes through its Node ESM wrapper in the Agent Host.
  - "!node_modules/officeparser/dist/officeparser.browser*.{js,mjs}"
  - package.json
asarUnpack:
  - node_modules/@silvia-odwyer/photon-node/**
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: licenses
    to: licenses
  - from: artifacts/toolchain/current
    to: toolchain
  - from: artifacts/capabilities/current
    to: capabilities
protocols:
  - name: π
    schemes:
      - pi67
win:
  icon: eng/packaging/pi.ico
  executableName: Pi-67 Desktop
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Pi-67-Desktop-${version}-win-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: eng/packaging/installer.nsh
  deleteAppDataOnUninstall: false
  shortcutName: π
  uninstallDisplayName: π ${version}
mac:
  icon: eng/packaging/pi.icns
  executableName: Pi-67 Desktop
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: Pi-67-Desktop-${version}-mac-arm64.${ext}
  category: public.app-category.developer-tools
  minimumSystemVersion: 12.0.0
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: eng/packaging/entitlements.mac.plist
  entitlementsInherit: eng/packaging/entitlements.mac.plist
  extendInfo:
    CFBundleDisplayName: π
publish:
  provider: github
  owner: bigKING67
  repo: pi-67-desktop
