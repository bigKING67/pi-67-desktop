name: Performance certification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to certify
        required: false
        default: main
        type: string
      large_session_profile:
        description: Large Session JSONL certification size
        required: false
        default: standard
        type: choice
        options:
          - standard
          - extended
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
            arch: x64
          - platform: macos-arm64
            os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Verify runner architecture
        shell: bash
        run: >-
          node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected runner arch: ' + process.arch)"
      - run: corepack pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --no-shell chromium
      - name: Measure and enforce release performance
        env:
          PI67_PERF_SAMPLES: 10
          PI67_PERF_JSONL_BOUNDARY_SAMPLES: 3
          PI67_PERF_ENFORCE: 1
        run: corepack pnpm run performance:measure
      - name: Measure large Session JSONL certification
        env:
          PI67_PERF_LARGE_SESSION_PROFILE: ${{ inputs.large_session_profile || 'standard' }}
          PI67_PERF_LARGE_SESSION_SAMPLES: 1
        run: corepack pnpm run performance:large-session
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: performance-certification-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/performance/*.json
          if-no-files-found: error
          retention-days: 30
