name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_quality: ${{ steps.scope.outputs.run_quality }}
      run_windows: ${{ steps.scope.outputs.run_windows }}
      run_macos: ${{ steps.scope.outputs.run_macos }}
      reuse_windows_installer: ${{ steps.scope.outputs.reuse_windows_installer }}
      reuse_windows_installer_available: ${{ steps.installer-reuse.outputs.reuse_available }}
      reuse_source_run_id: ${{ steps.installer-reuse.outputs.source_run_id }}
      reuse_source_sha: ${{ steps.installer-reuse.outputs.source_sha }}
      full_validation: ${{ steps.scope.outputs.full_validation }}
      scope_reason: ${{ steps.scope.outputs.scope_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify affected validation scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          node eng/ci/classify-change-scope.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
      - name: Resolve reusable Windows installer candidate
        id: installer-reuse
        if: steps.scope.outputs.reuse_windows_installer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          node eng/ci/resolve-windows-installer-reuse.mjs
          --base "$BASE_SHA"
          --repository "$GITHUB_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"

  quality-and-renderer:
    name: Quality and renderer / macOS arm64
    needs: change-scope
    if: >-
      needs.change-scope.outputs.run_quality == 'true' ||
      (needs.change-scope.outputs.reuse_windows_installer == 'true' &&
       needs.change-scope.outputs.reuse_windows_installer_available != 'true')
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@24.18.0
          cache: true
          install: false
      - name: Verify runner architecture
        shell: bash
        run: node -e "if (process.arch !== 'arm64') throw new Error('Expected arm64, got ' + process.arch)"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality gates
        run: pnpm run check
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --no-shell chromium
      - name: Renderer browser E2E
        run: pnpm exec playwright test --project=renderer-chromium --workers=2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: quality-renderer-failure-evidence-arm64
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  native-windows:
    name: Native smoke / Windows x64
    needs: change-scope
    if: >-
      needs.change-scope.outputs.run_windows == 'true' ||
      (needs.change-scope.outputs.reuse_windows_installer == 'true' &&
       needs.change-scope.outputs.reuse_windows_installer_available != 'true')
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@24.18.0
          cache: true
          install: false
      - name: Verify runner architecture
        shell: bash
        run: node -e "if (process.arch !== 'x64') throw new Error('Expected x64, got ' + process.arch)"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore prepared runtime resources
        uses: actions/cache@v5
        with:
          path: |
            artifacts/toolchain/cache
            artifacts/toolchain/current
            artifacts/capabilities/sources
            artifacts/capabilities/generated
            artifacts/capabilities/current
          key: pi67-runtime-resources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/packaging/toolchain.lock.json', 'eng/packaging/prepare-toolchain.mjs', 'eng/capabilities/capability-sources.lock.json', 'eng/capabilities/bundled-skill-suites.json', 'eng/capabilities/*.mjs') }}
      - name: Build apps and prepare runtime resources
        run: |
          pnpm run build
          pnpm run prepare:runtime-resources
      - name: Native Electron E2E
        run: pnpm exec playwright test --project=electron --workers=1
      - name: Build fast unsigned Windows smoke package
        run: pnpm exec node eng/packaging/package-native-unsigned.mjs --prepared-resources --ci-fast
      - name: Smoke packaged Electron runtime
        run: pnpm run package:smoke
      - name: Verify Windows packaged synthetic scale and IME contracts
        run: pnpm run package:smoke:windows-ui
      - name: Verify Windows NSIS installer lifecycle
        run: pnpm run package:smoke:windows-installer
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-installer-debug-candidate-${{ github.run_id }}
          path: |
            artifacts/release/Pi-67-Desktop-*-win-x64.exe
            artifacts/release/win-unpacked/Pi-67 Desktop.exe
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-packaged-ui-x64
          path: artifacts/validation/windows-packaged-ui/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer-lifecycle-x64
          path: artifacts/validation/windows-installer-lifecycle/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-smoke-failure-evidence-x64
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows-installer-reuse:
    name: Windows installer lifecycle / reused candidate
    needs: change-scope
    if: >-
      needs.change-scope.outputs.reuse_windows_installer == 'true' &&
      needs.change-scope.outputs.reuse_windows_installer_available == 'true'
    uses: ./.github/workflows/windows-installer-debug.yml
    with:
      source_run_id: ${{ needs.change-scope.outputs.reuse_source_run_id }}
      source_sha: ${{ needs.change-scope.outputs.reuse_source_sha }}
      verifier_ref: ${{ github.sha }}
    permissions:
      actions: read
      contents: read

  native-macos:
    name: Native smoke / macOS arm64
    needs: change-scope
    if: needs.change-scope.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v1
        with:
          version: 11.16.0
          runtime: node@24.18.0
          cache: true
          install: false
      - name: Verify runner architecture
        shell: bash
        run: node -e "if (process.arch !== 'arm64') throw new Error('Expected arm64, got ' + process.arch)"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore prepared runtime resources
        uses: actions/cache@v5
        with:
          path: |
            artifacts/toolchain/cache
            artifacts/toolchain/current
            artifacts/capabilities/sources
            artifacts/capabilities/generated
            artifacts/capabilities/current
          key: pi67-runtime-resources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('eng/packaging/toolchain.lock.json', 'eng/packaging/prepare-toolchain.mjs', 'eng/capabilities/capability-sources.lock.json', 'eng/capabilities/bundled-skill-suites.json', 'eng/capabilities/*.mjs') }}
      - name: Build apps and prepare runtime resources
        run: |
          pnpm run build
          pnpm run prepare:runtime-resources
      - name: Native Electron E2E
        run: pnpm exec playwright test --project=electron --workers=1
      - name: Build unsigned macOS smoke package
        run: pnpm exec node eng/packaging/package-native-unsigned.mjs --prepared-resources
      - name: Smoke packaged Electron runtime
        run: pnpm run package:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-smoke-failure-evidence-arm64
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  ci-gate:
    name: CI Gate
    if: always()
    needs: [change-scope, quality-and-renderer, native-windows, native-macos, windows-installer-reuse]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify selected validation jobs
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          RUN_QUALITY: ${{ needs.change-scope.outputs.run_quality }}
          QUALITY_RESULT: ${{ needs.quality-and-renderer.result }}
          RUN_WINDOWS: ${{ needs.change-scope.outputs.run_windows }}
          WINDOWS_RESULT: ${{ needs.native-windows.result }}
          RUN_MACOS: ${{ needs.change-scope.outputs.run_macos }}
          MACOS_RESULT: ${{ needs.native-macos.result }}
          REUSE_WINDOWS_INSTALLER: ${{ needs.change-scope.outputs.reuse_windows_installer }}
          REUSE_AVAILABLE: ${{ needs.change-scope.outputs.reuse_windows_installer_available }}
          WINDOWS_REUSE_RESULT: ${{ needs.windows-installer-reuse.result }}
        run: >-
          node eng/ci/verify-ci-gate.mjs
          "$SCOPE_RESULT"
          "$RUN_QUALITY" "$QUALITY_RESULT"
          "$RUN_WINDOWS" "$WINDOWS_RESULT"
          "$RUN_MACOS" "$MACOS_RESULT"
          "$REUSE_WINDOWS_INSTALLER" "$REUSE_AVAILABLE" "$WINDOWS_REUSE_RESULT"
