name: Windows candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main commit SHA to build for Windows testing
        required: true
        type: string
      baseline_run_id:
        description: Successful previous-version Windows candidate run ID
        required: true
        type: string
      baseline_run_attempt:
        description: Build attempt containing the previous-version candidate
        required: true
        type: string
      baseline_source_sha:
        description: Full main commit SHA used by the previous-version candidate
        required: true
        type: string

concurrency:
  group: windows-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Refresh main source authority
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Verify exact main candidate source
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_sha }}
        run: >-
          node eng/release/preview-candidate-source.mjs
          --source-commit "$SOURCE_COMMIT"
          --github-output "$GITHUB_OUTPUT"
      - name: Require an unpublished version identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; bump the package version before building a candidate." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; bump the package version before building a candidate." >&2
            exit 1
          fi
      - name: Verify locked capability sources are remotely fetchable
        run: node eng/capabilities/verify-capability-source-lock.mjs
      - run: corepack pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: corepack pnpm run check:dependencies
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: production-dependency-audit-windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/production-dependency-audit.json
          if-no-files-found: error
          retention-days: 14
      - run: corepack pnpm run verify:extension-adapters
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: extension-adapter-provenance-windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/extension-adapter-provenance.json
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: provenance
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      internal_artifact_name: ${{ steps.names.outputs.internal }}
      candidate_run_attempt: ${{ steps.names.outputs.attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.provenance.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Verify Windows x64 runner
        shell: bash
        run: >-
          node -e "if (process.platform !== 'win32' || process.arch !== 'x64') throw new Error('Unexpected runner: ' + process.platform + '/' + process.arch)"
      - name: Refresh and verify exact main candidate source
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.provenance.outputs.source_commit }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node eng/release/preview-candidate-source.mjs --source-commit "$SOURCE_COMMIT"
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run package:native:unsigned
      - name: Run packaged Electron smoke
        env:
          PI67_PACKAGED_SCREENSHOT_DIR: artifacts/validation/windows-packaged-smoke
        run: corepack pnpm run package:smoke
      - name: Upload packaged Electron smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-packaged-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation/windows-packaged-smoke/
          if-no-files-found: warn
          retention-days: 3
      - name: Verify Windows packaged synthetic scale and IME contracts
        run: corepack pnpm run package:smoke:windows-ui
      - name: Upload Windows packaged UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-packaged-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation/windows-packaged-ui/
          if-no-files-found: warn
          retention-days: 3
      - name: Create and verify Windows candidate identity
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ needs.provenance.outputs.source_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem artifacts/release/Pi-67-Desktop-*-win-x64.exe -File)
          if ($installers.Count -ne 1) { throw "Expected one Windows candidate installer, found $($installers.Count)." }
          $executable = 'artifacts/release/win-unpacked/Pi-67 Desktop.exe'
          $identity = 'artifacts/release/windows-preview-candidate-identity.json'
          corepack pnpm run release:preview:candidate create `
            --installer $installers[0].FullName `
            --packaged-executable $executable `
            --repository $env:GITHUB_REPOSITORY `
            --source-commit $env:SOURCE_COMMIT `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --output $identity
          corepack pnpm run release:preview:candidate verify `
            --candidate-identity $identity `
            --installer $installers[0].FullName `
            --packaged-executable $executable `
            --expected-repository $env:GITHUB_REPOSITORY `
            --expected-source-commit $env:SOURCE_COMMIT `
            --expected-run-id $env:GITHUB_RUN_ID `
            --expected-run-attempt $env:GITHUB_RUN_ATTEMPT
      - name: Resolve internal artifact name
        id: names
        shell: bash
        run: |
          echo "internal=windows-candidate-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.internal }}
          path: |
            artifacts/release/Pi-67-Desktop-*-win-x64.exe
            artifacts/release/win-unpacked/Pi-67 Desktop.exe
            artifacts/release/windows-preview-candidate-identity.json
            artifacts/validation/windows-packaged-ui/
          if-no-files-found: error
          retention-days: 1

  certify-installer:
    needs: [provenance, build-windows]
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.provenance.outputs.source_commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Build verifier workspace dependencies
        run: corepack pnpm run build:packages
      - name: Download exact candidate build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build-windows.outputs.internal_artifact_name }}
          path: artifacts
      - name: Download exact previous-version candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-candidate-${{ inputs.baseline_run_id }}-${{ inputs.baseline_run_attempt }}
          path: artifacts/baseline
          github-token: ${{ github.token }}
          run-id: ${{ inputs.baseline_run_id }}
      - name: Verify candidate and installer helper tests
        run: >-
          corepack pnpm exec vitest run
          eng/release/windows-preview-candidate.test.mjs
          eng/packaging/controlled-shutdown-fixture.test.mjs
          eng/packaging/verify-windows-installer-lifecycle.test.mjs
          eng/packaging/windows-installed-application-lifecycle.test.mjs
          eng/packaging/windows-artifact-identity.test.mjs
          apps/agent-host/src/lark-cli-resolution.test.ts
          apps/agent-host/src/skill-pack-process-execution.test.ts
      - name: Reverify exact Windows candidate bytes
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ needs.provenance.outputs.source_commit }}
          CANDIDATE_BUILD_ATTEMPT: ${{ needs.build-windows.outputs.candidate_run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem artifacts/release/Pi-67-Desktop-*-win-x64.exe -File)
          if ($installers.Count -ne 1) { throw "Expected one Windows candidate installer, found $($installers.Count)." }
          corepack pnpm run release:preview:candidate verify `
            --candidate-identity artifacts/release/windows-preview-candidate-identity.json `
            --installer $installers[0].FullName `
            --packaged-executable 'artifacts/release/win-unpacked/Pi-67 Desktop.exe' `
            --expected-repository $env:GITHUB_REPOSITORY `
            --expected-source-commit $env:SOURCE_COMMIT `
            --expected-run-id $env:GITHUB_RUN_ID `
            --expected-run-attempt $env:CANDIDATE_BUILD_ATTEMPT
      - name: Verify exact previous-version upgrade baseline
        shell: pwsh
        env:
          BASELINE_RUN_ATTEMPT: ${{ inputs.baseline_run_attempt }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_SOURCE_SHA: ${{ inputs.baseline_source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem artifacts/baseline/release/Pi-67-Desktop-*-win-x64.exe -File)
          if ($installers.Count -ne 1) { throw "Expected one previous-version installer, found $($installers.Count)." }
          corepack pnpm run release:preview:candidate verify `
            --candidate-identity artifacts/baseline/release/windows-preview-candidate-identity.json `
            --installer $installers[0].FullName `
            --packaged-executable 'artifacts/baseline/release/win-unpacked/Pi-67 Desktop.exe' `
            --expected-repository $env:GITHUB_REPOSITORY `
            --expected-source-commit $env:BASELINE_SOURCE_SHA `
            --expected-run-id $env:BASELINE_RUN_ID `
            --expected-run-attempt $env:BASELINE_RUN_ATTEMPT
          "PI67_WINDOWS_BASELINE_INSTALLER=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify full Windows NSIS installer lifecycle
        run: corepack pnpm run package:smoke:windows-installer
      - name: Upload Windows installer lifecycle diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-installer-lifecycle-windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation/windows-installer-lifecycle/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload testable Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/Pi-67-Desktop-*-win-x64.exe
            artifacts/release/win-unpacked/Pi-67 Desktop.exe
            artifacts/release/windows-preview-candidate-identity.json
            artifacts/validation/windows-packaged-ui/
            artifacts/validation/windows-installer-lifecycle/
          if-no-files-found: error
          retention-days: 14
      - name: Write candidate summary
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.provenance.outputs.source_commit }}
        run: |
          {
            echo '## Windows candidate ready for manual testing'
            echo
            echo "- Source: \`$SOURCE_COMMIT\`"
            echo "- Artifact: \`windows-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
            echo '- Installed profile authority: localized path, seeded Pi configuration, and post-Main environment drift verified'
            echo '- Status: candidate only; no Tag or GitHub Release was created'
          } >> "$GITHUB_STEP_SUMMARY"
