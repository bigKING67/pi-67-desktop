name: Capability freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
      - name: Verify locked capability sources are remotely fetchable
        run: node eng/capabilities/verify-capability-source-lock.mjs
      - name: Verify first-party capability freshness
        run: node eng/capabilities/check-capability-freshness.mjs --json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capability-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/capability-freshness.json
          if-no-files-found: error
          retention-days: 30
